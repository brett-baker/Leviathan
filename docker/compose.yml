# Test lab for Leviathan's network tests (spec 19.2): a Samba share and Toxiproxy in front of it.
# Never aimed at real shares. Start with `docker compose -f docker/compose.yml up -d`, stop with `down -v`.
#
#   samba     SMB on localhost:1445, share "leviathan" (user "lab", password "lab-only-test-password"; test values for this container only)
#   toxiproxy API on localhost:8474; proxy listeners 2445 (-> samba:445), created by the tests, not here
services:
  samba:
    image: crazymax/samba:4.23.8
    ports:
      - "127.0.0.1:1445:445"
    environment:
      TZ: UTC
      SAMBA_LOG_LEVEL: "0"
    volumes:
      - ./samba/config.yml:/data/config.yml:ro
      - share:/samba/leviathan
    healthcheck:
      test: ["CMD-SHELL", "smbclient -L localhost -U lab%lab-only-test-password -c exit >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:2445:2445"
    depends_on:
      samba:
        condition: service_started

volumes:
  share:
